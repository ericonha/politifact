[project]
name = "politifact"
version = "0.1.0"
description = "Fact-checking e análise de cobertura de mídia — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "rq>=1.16",
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B008",  # FastAPI: Depends(...) em argumento padrão é o uso previsto
    "B905",  # zip sem strict=: os usos aqui têm tamanhos iguais por construção
]

[tool.ruff.lint.per-file-ignores]
# Prompts de LLM são prosa longa dentro de strings: reformatar mudaria o texto (e a versão do prompt).
"app/briefing/core.py" = ["E501"]
"app/factcheck/extract.py" = ["E501"]
"app/factcheck/press_verdict.py" = ["E501"]
"app/factcheck/verdict.py" = ["E501"]
"app/framing/llm.py" = ["E501"]
